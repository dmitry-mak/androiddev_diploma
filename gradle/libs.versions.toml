[versions]
agp = "8.13.2"
kotlin = "2.3.0"
ksp = "2.3.5"
hilt = "2.58"
navigation = "2.9.7"
retrofit = "3.0.0"
okhttp = "5.3.2"
coroutines = "1.10.2"
lifecycle = "2.9.1"
